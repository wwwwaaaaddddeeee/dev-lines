<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dev-lines — changelog</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#0a0a0a; --muted:#6b7280; --faint:#9ca3af; --hair:#ececec; --pink:236 72 153; --card:#fafafa; }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin:0; background:#fff; color:var(--ink); font-family:"Geist",system-ui,sans-serif; font-size:15px; line-height:1.55; letter-spacing:-0.01em; }
  code, kbd { font-family:"Geist Mono",ui-monospace,monospace; }
  .wrap { max-width:640px; margin:0 auto; padding:0 24px; }

  header { padding:48px 0 28px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--hair); }
  .logo { width:22px; height:22px; }
  header .name { font-weight:600; font-size:16px; letter-spacing:-0.02em; }
  header a.home { margin-left:auto; color:var(--faint); text-decoration:none; font-size:13px; }
  header a.home:hover { color:var(--ink); }

  .state { padding:24px 0; color:var(--faint); font-size:13px; }

  /* rendered markdown */
  #log { padding:14px 0 80px; }
  #log h1 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--faint); margin:0 0 4px; }
  #log h1 + p { color:var(--muted); font-size:13px; margin:0 0 8px; }
  #log h2 { font-size:18px; font-weight:600; letter-spacing:-0.02em; margin:40px 0 4px; padding-top:24px; border-top:1px solid var(--hair); }
  #log h2:first-of-type { border-top:0; padding-top:0; margin-top:20px; }
  #log h3 { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--pink-text,#ec4899); margin:18px 0 8px; }
  #log ul { margin:0; padding-left:18px; }
  #log li { margin:6px 0; color:#1f2937; }
  #log li strong { color:var(--ink); font-weight:600; }
  #log code { background:var(--card); border:1px solid var(--hair); border-radius:5px; padding:1px 5px; font-size:12.5px; }
  #log a { color:#ec4899; text-decoration:none; }
  #log a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M6 26 18 6M14 26 26 6" stroke="rgb(236 72 153)" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M2 16h28" stroke="rgb(6 182 212)" stroke-width="3.4" stroke-linecap="round" opacity=".55"/>
      </svg>
      <span class="name">dev-lines</span>
      <a class="home" href="./">← Home</a>
    </header>
    <div id="log"><p class="state">Loading changelog…</p></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script>
    fetch("./CHANGELOG.md", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then((md) => { document.getElementById("log").innerHTML = marked.parse(md); })
      .catch((e) => { document.getElementById("log").innerHTML = '<p class="state">Could not load changelog (' + e.message + ').</p>'; });
  </script>
</body>
</html>
