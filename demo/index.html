<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dev-lines — layout guides & section outlines for localhost</title>
<meta name="description" content="Center, width, and padding guides plus depth-colored outlines and labels around every layout box — on localhost, in any framework." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://lines.wiki/" />
<meta property="og:title" content="dev-lines — see the lines before you ship the bug" />
<meta property="og:description" content="Center, width, and padding guides plus depth-colored outlines for any localhost layout." />
<meta property="og:image" content="https://lines.wiki/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="dev-lines — see the lines before you ship the bug" />
<meta name="twitter:description" content="Center, width, and padding guides plus depth-colored outlines for any localhost layout." />
<meta name="twitter:image" content="https://lines.wiki/og.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink: 251 7 12; /* #fb070c */
    --tb: 113 113 122; /* toolbar accent — muted neutral gray (#71717a) */
    --cyan: 24 207 255;
    --blue: 24 83 239;
    --red: 242 26 50;
    --green: 29 206 105;
    --purple: 190 49 208;
    --orange: 241 98 0;
    --teal: 22 166 126;
    --ink: #0a0a0a;
    --muted: #6b7280;
    --faint: #9ca3af;
    --hair: #ececec;
    --bg: #ffffff;
    --card: #fafafa;
    /* easing tokens */
    --ease-out-cubic: cubic-bezier(0.215, 0.61, 0.355, 1);
    --ease-out-quint: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Geist", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  code, kbd, .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  .wrap { max-width: 640px; width: 100%; margin: 0 auto; padding: 0 24px 144px; text-align: center;
    flex: 1; display: flex; flex-direction: column; justify-content: center; }
  a { color: inherit; }

  /* floating toolbar, à la the real tool */
  .toolbar { position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%); z-index: 2147483601;
    display: flex; align-items: center; gap: 2px; background: #fff; border: 1px solid var(--hair);
    border-radius: 999px; padding: 5px; box-shadow: 0 6px 22px rgb(0 0 0 / .08); }
  .tb-btn { all: unset; cursor: pointer; width: 28px; height: 28px; border-radius: 999px; position: relative;
    display: grid; place-items: center; color: var(--faint); transition: background .12s, color .12s, transform .12s var(--ease-out-cubic); }
  .tb-btn:hover { background: var(--card); color: var(--muted); }
  .tb-btn:active { transform: scale(.92); }
  .tb-btn.active { background: rgb(var(--tb) / .12); color: rgb(var(--tb)); }
  .tb-btn.power.active { background: rgb(var(--tb)); color: #fff; }
  .tb-btn.dim { opacity: .35; pointer-events: none; }
  .tb-btn .mode-dot { position: absolute; bottom: 3px; right: 4px; width: 4px; height: 4px; border-radius: 50%; background: rgb(var(--tb)); display: none; }
  .tb-btn.active .mode-dot { display: block; }
  .tb-sep { width: 1px; height: 18px; background: var(--hair); margin: 0 3px; }
  .tb-menu { position: absolute; bottom: calc(100% + 7px); top: auto; left: 0; width: 222px; background: #fff;
    border: 1px solid var(--hair); border-radius: 12px; box-shadow: 0 10px 28px rgb(0 0 0 / .12); padding: 12px; }
  .tb-menu { transform-origin: bottom left; animation: menu-in .18s var(--ease-out-cubic); }
  .tb-menu[hidden] { display: none; }
  @keyframes menu-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  .tb-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 12px; color: var(--muted); }
  .tb-seg { display: inline-flex; gap: 2px; background: var(--card); border: 1px solid var(--hair); border-radius: 7px; padding: 2px; }
  .tb-seg button { all: unset; cursor: pointer; font: 11px "Geist Mono", monospace; padding: 2px 7px; border-radius: 5px; color: var(--faint); }
  .tb-seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  .tb-sw { display: flex; gap: 5px; }
  .tb-sw .chip { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .08); }
  .tb-sw input[type=color] { -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
    border: none; border-radius: 4px; padding: 0; cursor: pointer; background: none; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); }
  .tb-sw input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .tb-sw input[type=color]::-webkit-color-swatch { border: none; border-radius: 4px; }
  #c-depth { flex-wrap: wrap; justify-content: flex-end; max-width: 156px; }
  .tb-menu .keys { margin-top: 8px; padding-top: 9px; border-top: 1px solid var(--hair); font: 11px/1.8 "Geist Mono", monospace; color: var(--faint); }
  .tb-menu .keys b { color: var(--muted); font-weight: 600; }

  header.hero { padding: 0; }
  .mark { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .logo { width: 26px; height: 26px; }
  .name { font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
  .ver { color: var(--faint); font-size: 13px; }
  .gh { color: var(--faint); display: inline-flex; margin-left: -3px; }
  .headline { font-size: 15px; line-height: 1.5; font-weight: 500; letter-spacing: -0.01em; margin: 22px 0 0; color: var(--muted); }
  .headline .dim { color: var(--faint); }
  .sub { color: var(--muted); font-size: 16px; max-width: 30rem; margin: 26px 0 0; }

  /* hero showcase — the overlay rendered on a mini layout */
  .showcase {
    position: relative; margin: 40px 0 8px; height: 320px; border: 1px solid var(--hair);
    border-radius: 14px; background: var(--card); overflow: hidden;
  }
  .mini { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 28px; gap: 22px; }
  .mini .topbar { width: 70%; display: flex; justify-content: center; }
  .mini .tag { font-size: 9px; color: rgb(var(--blue)); background: rgb(var(--blue) / 0.07); padding: 1px 6px; border-radius: 4px; }
  .mini .col { width: 70%; display: flex; flex-direction: column; gap: 18px; flex: 1; }
  .mini .deck { height: 96px; display: grid; place-items: center; }
  .mini .deck > div { width: 62%; height: 72%; border-radius: 8px;
    background: linear-gradient(90deg,#4db8ff,#4de2c0,#9be84d,#ffd24d,#ff8a3d,#ff4d4d); opacity:.9; }
  .mini .bar { height: 9px; border-radius: 3px; background: #e6e6ea; }
  .mini .bar.s { width: 56%; } .mini .bar.m { width: 84%; }
  .mini .row { display: flex; justify-content: space-between; align-items: center; }
  .mini .dots { display: flex; gap: 6px; }
  .mini .dot { width: 13px; height: 13px; border-radius: 4px; background: #d4d4d8; }
  .mini .pill { font-size: 10px; color: var(--faint); border: 1px solid #dcdce0; border-radius: 999px; padding: 2px 9px; }

  /* overlay lines + rings scoped to the showcase */
  .ov { position: absolute; inset: 0; pointer-events: none; }
  .ov > div { position: absolute; }
  .ov .cv { top:0; bottom:0; left:50%; width:1px; transform:translateX(-50%); background: rgb(var(--pink)/.7); }
  .ov .ch { left:0; right:0; top:50%; height:1px; transform:translateY(-50%); background: rgb(var(--pink)/.7); }
  .ov .pl { top:0; bottom:0; left:14%; width:1px; background: rgb(var(--cyan)/.7); }
  .ov .pr { top:0; bottom:0; right:14%; width:1px; background: rgb(var(--cyan)/.7); }
  .ring { box-shadow: inset 0 0 0 1px rgb(var(--c)/.65); position: relative; }
  .cap { position: absolute; left: 0; top: 0; font: 500 9px/1.4 "Geist Mono", monospace;
    color: #fff; padding: 1px 5px; border-radius: 4px; white-space: nowrap; background: rgb(var(--c)/.92); }

  /* showcase draw-in: guides sketch themselves over the static layout */
  .ov > div { animation: draw-v .5s var(--ease-out-quint) backwards; }
  .ov .cv { transform-origin: top center; }
  .ov .ch { transform-origin: center left; animation-name: draw-h; }
  .ov .pl { animation-delay: 0ms; }
  .ov .pr { animation-delay: .07s; }
  .ov .cv { animation-delay: .18s; }
  .ov .ch { animation-delay: .26s; }
  @keyframes draw-v { from { transform: translateX(var(--tx,0)) scaleY(0); } to { transform: translateX(var(--tx,0)) scaleY(1); } }
  @keyframes draw-h { from { transform: translateY(-50%) scaleX(0); } to { transform: translateY(-50%) scaleX(1); } }
  .ov .cv { --tx: -50%; }
  .showcase .cap { animation: cap-in .3s var(--ease-out-cubic) .42s backwards; }
  @keyframes cap-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

  .depthdemo { position: relative; display: flex; width: 100%; max-width: 360px; height: 240px; margin: 48px auto 0;
    border: 1px solid var(--hair); border-radius: 14px; background: var(--card); }
  .depthdemo .d { position: relative; display: flex; flex: 1; padding: 8px; min-width: 0;
    box-shadow: inset 0 0 0 1px rgb(0 0 0 / .04); border-radius: 5px;
    transition: box-shadow .15s var(--ease-out-cubic), background-color .15s var(--ease-out-cubic); }
  /* coloured rings when "show all 12 depths" is on (JS sets --dc per box) */
  .depthdemo.on, .depthdemo.on .d { box-shadow: inset 0 0 0 1px rgb(var(--dc) / .6); }
  /* hover-to-pop: only the deepest box under the cursor lights up and lifts above the rest */
  .depthdemo .d:hover:not(:has(.d:hover)) {
    background-color: rgb(var(--dc, 0 0 0) / .16);
    box-shadow: inset 0 0 0 1.5px rgb(var(--dc, 0 0 0)), 0 6px 18px rgb(var(--dc, 0 0 0) / .3);
    z-index: 3; }
  /* pull the hovered box's name forward, above the nested boxes drawn over it */
  .dd-label { z-index: 1; transition: transform .15s var(--ease-out-cubic), box-shadow .15s var(--ease-out-cubic); }
  .depthdemo .d:hover:not(:has(.d:hover)) > .dd-label {
    z-index: 6; transform: translateY(-2px); box-shadow: 0 3px 10px rgb(var(--dc, 0 0 0) / .45); }
  .dd-label { position: absolute; top: 0; left: 0; font: 500 9px/1.4 "Geist Mono", monospace;
    color: #fff; padding: 1px 5px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
  .dd-switch { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 18px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .dd-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .dd-switch .track { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--hair); transition: background .18s; flex: none; }
  .dd-switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .18s var(--ease-out-cubic); }
  .dd-switch input:checked + .track { background: rgb(var(--pink)); }
  .dd-switch input:checked + .track::after { transform: translateX(16px); }
  .pal-min { display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: 22px; opacity: .7; transition: opacity .18s; }
  .pal-min:hover { opacity: 1; }
  .pal-min .pd { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .08); }
  .pal-min .pal-sep { width: 1px; height: 11px; background: var(--hair); margin: 0 6px; }

  section { padding: 16px 0; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); margin: 0 0 22px; }

  .feat { display: flex; gap: 12px; padding: 9px 0; align-items: baseline; }
  .feat .ic { width: 16px; color: rgb(var(--pink)); flex: none; font-family: "Geist Mono", monospace; }
  .feat b { font-weight: 600; }
  .feat span { color: var(--muted); }

  .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 32px; }
  .sub-h { font-size: 12px; font-weight: 500; color: var(--faint); margin: 14px 0 4px; grid-column: 1 / -1; }
  .sub-h:first-child { margin-top: 0; }
  .sw { display: flex; align-items: center; gap: 11px; padding: 7px 0; }
  .sw .chip { width: 18px; height: 18px; border-radius: 5px; flex: none; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); }
  .sw .lbl { font-size: 14px; }
  .sw .hex { margin-left: auto; font-family: "Geist Mono", monospace; font-size: 13px; color: var(--muted); }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .uicard { border: 1px solid var(--hair); border-radius: 12px; padding: 20px; }
  .uicard .ci { width: 22px; height: 22px; color: var(--ink); margin-bottom: 14px; }
  .uicard h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .uicard p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .uicard a { font-size: 14px; color: rgb(var(--pink)); text-decoration: none; font-weight: 500; }

  pre { background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 18px 20px;
    overflow-x: auto; font-size: 13px; line-height: 1.6; color: #1f2937; }
  pre .k { color: rgb(var(--purple)); } pre .s { color: rgb(var(--green)); } pre .c { color: var(--faint); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 10px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
  td:first-child { width: 38%; }
  td .mono { color: var(--ink); }
  td .desc { color: var(--muted); }
  kbd { font-family: "Geist Mono", monospace; font-size: 12px; background: var(--card); border: 1px solid var(--hair);
    border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; color: #1f2937; }

  footer { padding: 14px 24px 18px;
    color: var(--faint); font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 18px; }
  footer .left { display: flex; align-items: center; gap: 10px; }
  footer .foot-logo { width: 13px; height: 13px; }
  footer .lic a { color: var(--muted); text-decoration: none; }
  footer .lic a:hover { color: var(--ink); }
  footer .links { display: flex; align-items: center; gap: 15px; }
  footer .links a { color: var(--faint); display: inline-flex; }
  footer .links a:hover { color: var(--ink); }

  /* install flow (agentation-style: choose your setup → steps) */
  .lead { color: var(--muted); margin: 0 0 18px; }
  .setup-tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--hair); border-radius: 11px; margin-bottom: 26px; }
  .setup-tab { all: unset; cursor: pointer; font-size: 13px; padding: 6px 13px; border-radius: 8px; color: var(--muted); transition: color .15s; }
  .setup-tab.active { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .07); }
  .panel { display: none; }
  .panel.active { display: block; animation: fade .2s var(--ease-out-cubic); }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .step { display: flex; gap: 14px; padding: 6px 0 18px; }
  .step .num { flex: none; width: 22px; height: 22px; border-radius: 999px; border: 1px solid var(--hair);
    display: grid; place-items: center; font: 500 11px "Geist Mono", monospace; color: var(--muted); }
  .step-b { flex: 1; min-width: 0; }
  .step-b h3 { margin: 1px 0 10px; font-size: 14px; font-weight: 600; }
  .btn { display: inline-block; background: var(--ink); color: #fff; text-decoration: none; font-size: 14px;
    font-weight: 500; padding: 10px 16px; border-radius: 9px; }
  .codeblock { position: relative; }
  .codeblock pre { margin: 0; }
  .codeblock .copy { position: absolute; top: 9px; right: 9px; all: unset; cursor: pointer;
    font: 500 11px "Geist Mono", monospace; color: var(--faint); background: #fff; border: 1px solid var(--hair);
    padding: 3px 8px; border-radius: 6px; }
  .codeblock .copy:hover { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-delay: 0ms !important;
      transition-duration: .01ms !important;
    }
  }

  /* mobile: lock the page so dev-line gestures on the boxes don't scroll the page */
  @media (max-width: 640px) {
    html, body { height: 100dvh; min-height: 100dvh; overflow: hidden; overscroll-behavior: none; }
    .wrap { flex: 1; min-height: 0; padding-top: 28px; padding-bottom: 0; justify-content: flex-start; }
    .depthdemo { margin-top: 28px; }
  }
</style>
</head>
<body>
  <!-- floating toolbar -->
  <div class="toolbar" id="dl-bar" data-devlines="ignore">
    <button class="tb-btn power" id="tb-power" title="Toggle dev-lines (⌘/Ctrl+Shift+L)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 2v6"/><path d="M4.4 4.4a5 5 0 1 0 7.2 0"/></svg>
    </button>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="tb-guides" title="Guides (G)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v14M1 8h14"/></svg>
    </button>
    <button class="tb-btn" id="tb-outlines" title="Outlines (O)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/></svg>
    </button>
    <button class="tb-btn" id="tb-labels" title="Labels (L)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.6 6.4 7 2h6.5v6.5L9 13z"/><circle cx="10.4" cy="5.6" r="1" fill="currentColor" stroke="none"/></svg>
      <span class="mode-dot"></span>
    </button>
    <button class="tb-btn" id="tb-copy" title="Copy handle (C)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M3 10.5V3.5a1 1 0 0 1 1-1h7"/></svg>
    </button>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="tb-more" title="Settings">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <div class="tb-menu" id="tb-menu" hidden>
      <div class="tb-row"><span>Labels</span>
        <span class="tb-seg" id="tb-labelseg">
          <button data-mode="off">off</button><button data-mode="hover">hover</button><button data-mode="all">all</button>
        </span>
      </div>
      <div class="tb-row"><span>Distances</span><span style="color:var(--faint)">hold Alt</span></div>
      <div class="tb-row"><span>Guide colors</span><span class="tb-sw">
        <input type="color" id="c-line" value="#fb070c" title="Center &amp; width" />
        <input type="color" id="c-pad" value="#18cfff" title="Padding" />
      </span></div>
      <div class="tb-row"><span>Depth palette</span><span class="tb-sw" id="c-depth">
        <input type="color" value="#1d1d1d" /><input type="color" value="#9ba4b7" /><input type="color" value="#eb83f6" /><input type="color" value="#be31d0" /><input type="color" value="#1853ef" /><input type="color" value="#00a8ff" /><input type="color" value="#ffb522" /><input type="color" value="#f16200" /><input type="color" value="#16a67e" /><input type="color" value="#1dce69" /><input type="color" value="#ff8baa" /><input type="color" value="#f21a32" />
      </span></div>
      <div class="keys"><b>O</b> outlines · <b>G</b> guides · <b>L</b> labels · <b>C</b> copy · <b>Alt</b> dist · <b>Esc</b> off</div>
    </div>
  </div>

  <div class="wrap">
    <header class="hero">
      <div class="mark">
        <svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M6 26 18 6M14 26 26 6" stroke="rgb(255 0 0)" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M2 16h28" stroke="rgb(0 0 255)" stroke-width="3.4" stroke-linecap="round"/>
        </svg>
        <span class="name">dev-lines</span>
        <span class="ver">v0.0.0</span>
        <a class="gh" href="https://github.com/wwwwaaaaddddeeee/dev-lines" target="_blank" rel="noopener noreferrer" title="GitHub">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.6.5.5 5.6.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.3 1 .1-.7.4-1.3.7-1.5-2.6-.3-5.2-1.3-5.2-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.5.1-3 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C18.3 4.3 19.3 4.6 19.3 4.6c.6 1.5.2 2.7.1 3 .8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.2 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.6 18.4.5 12 .5Z"/></svg>

      <h1 class="headline">See the lines. <span class="dim">Before you ship the bug.</span></h1>
    </header>

    <section>
      <div class="depthdemo" data-devlines-name="Depth demo"><div class="d"><div class="d"><div class="d"><div class="d"><div class="d"><div class="d"><div class="d"><div class="d"><div class="d"><div class="d"><div class="d"></div></div></div></div></div></div></div></div></div></div></div></div>
      <label class="dd-switch"><input type="checkbox" id="dd-toggle" /><span class="track"></span> Show all 12 depths</label>

  <!-- live: run the real engine on this very page, driven by the toolbar -->
  <script type="module">
    import { createDevLines } from "./dev-lines.js";
    const dl = createDevLines({ contentWidth: 640, paddingX: 24, start: false, lineColor: "251 7 12" });
    const $ = (id) => document.getElementById(id);
    const power = $("tb-power"), guides = $("tb-guides"), outlines = $("tb-outlines"),
          labels = $("tb-labels"), copy = $("tb-copy"), more = $("tb-more"),
          menu = $("tb-menu"), bar = $("dl-bar"), labelseg = $("tb-labelseg");
    const ensureOn = () => { if (!dl.isEnabled()) dl.enable(); };

    function sync() {
      const s = dl.getState();
      power.classList.toggle("active", s.enabled);
      guides.classList.toggle("active", s.enabled && s.guides);
      outlines.classList.toggle("active", s.enabled && s.outlines);
      labels.classList.toggle("active", s.enabled && s.labels !== "off");
      labels.title = "Labels: " + s.labels + " (L)";
      [guides, outlines, labels, copy].forEach((b) => b.classList.toggle("dim", !s.enabled));
      labelseg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.mode === s.labels));
    }

    power.addEventListener("click", () => { dl.toggle(); sync(); });
    guides.addEventListener("click", () => { ensureOn(); dl.toggleGuides(); sync(); });
    outlines.addEventListener("click", () => { ensureOn(); dl.toggleOutlines(); sync(); });
    labels.addEventListener("click", () => { ensureOn(); dl.cycleLabels(); sync(); });
    copy.addEventListener("click", () => { ensureOn(); dl.copy(); });
    more.addEventListener("click", () => { menu.hidden = !menu.hidden; });
    labelseg.querySelectorAll("button").forEach((b) =>
      b.addEventListener("click", () => { ensureOn(); dl.cycleLabels(b.dataset.mode); sync(); }));

    // live color + position mods
    const triplet = (hex) => { const n = parseInt(hex.slice(1), 16); return `${(n >> 16) & 255} ${(n >> 8) & 255} ${n & 255}`; };
    const cLine = $("c-line"), cPad = $("c-pad"), cDepth = $("c-depth");
    cLine.addEventListener("input", () => { ensureOn(); dl.update({ lineColor: triplet(cLine.value) }); });
    cPad.addEventListener("input", () => { ensureOn(); dl.update({ paddingColor: triplet(cPad.value) }); });
    cDepth.addEventListener("input", () => { ensureOn(); dl.update({ depthColors: [...cDepth.querySelectorAll("input")].map((i) => triplet(i.value)) }); });

    // depth → color demo: paint the nested chain its depth colors on toggle
    const DEPTH = ["29 29 29","155 164 183","235 131 246","190 49 208","24 83 239","0 168 255","255 181 34","241 98 0","22 166 126","29 206 105","255 139 170","242 26 50"];
    const ddToggle = $("dd-toggle"), depthdemo = document.querySelector(".depthdemo");
    if (ddToggle && depthdemo) {
      const chain = [depthdemo];
      let cur = depthdemo.querySelector(":scope > .d");
      while (cur) { chain.push(cur); cur = cur.querySelector(":scope > .d"); }
      // give every box its depth colour up-front so hover-to-pop works on/off
      chain.forEach((node, i) => node.style.setProperty("--dc", DEPTH[Math.min(i, DEPTH.length - 1)]));
      ddToggle.addEventListener("change", () => {
        const on = ddToggle.checked;
        depthdemo.classList.toggle("on", on);
        chain.forEach((node, i) => {
          const c = DEPTH[Math.min(i, DEPTH.length - 1)];
          let lbl = node.querySelector(":scope > .dd-label");
          if (on) {
            if (!lbl) { lbl = document.createElement("span"); lbl.className = "dd-label"; node.prepend(lbl); }
            lbl.textContent = `<div> · ${node.offsetWidth}×${node.offsetHeight} · flex`;
            lbl.style.background = `rgb(${c} / .92)`;
          } else if (lbl) { lbl.remove(); }
        });
      });
    }

    document.addEventListener("click", (e) => { if (!bar.contains(e.target)) menu.hidden = true; });
    window.addEventListener("keydown", () => requestAnimationFrame(sync)); // reflect ⌘⇧L / O / G / L
    sync();

    // park the toolbar in the middle of the open space between the box and the footer
    const demoSection = document.querySelector("section"), footEl = document.querySelector("footer");
    function placeBar() {
      const mid = (demoSection.getBoundingClientRect().bottom + footEl.getBoundingClientRect().top) / 2;
      bar.style.top = mid + "px";
      bar.style.bottom = "auto";
      bar.style.transform = "translate(-50%, -50%)";
    }
    placeBar();
    window.addEventListener("resize", placeBar);
    window.addEventListener("load", placeBar);
  </script>
</body>
